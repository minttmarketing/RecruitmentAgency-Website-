    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How long does it usually take to hire?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Timing depends on the role and interview process. After we understand your requirements, we will agree on a realistic shortlist and update you as the search progresses."
            }
          },
          {
            "@type": "Question",
            "name": "How do your recruitment fees work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fees depend on the service and role. We explain the terms before beginning a search, so you can decide with clear information."
            }
          },
          {
            "@type": "Question",
            "name": "What happens after I share a role?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A recruiter will discuss the team, responsibilities and essential experience, then confirm the next steps before sourcing candidates."
            }
          },
          {
            "@type": "Question",
            "name": "Can I share my CV if there is no suitable job listed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can upload your CV and tell us what kind of role you are looking for. We will contact you if a suitable opportunity comes up."
            }
          },
          {
            "@type": "Question",
            "name": "Do you recruit for remote roles?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We work on remote and hybrid roles as well as positions tied to a specific office or region."
            }
          },
          {
            "@type": "Question",
            "name": "Will you keep my search or CV confidential?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We treat candidate information carefully and only share your CV with an employer after discussing the opportunity with you."
            }
          }
        ]
      }
